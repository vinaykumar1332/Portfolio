<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Title, description, Open Graph, Twitter and JSON-LD are generated from
         src/config/portfolio.json (see seo.plugin.js) -->
    <title>Vinay Kumar Pudi — Senior Frontend Developer</title>
    <!--SEO_HEAD-->
    <!--FONT_PRELOAD-->
    <meta name="theme-color" content="%THEME_COLOR%" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <!-- Apply the saved / system theme before first paint (no flash) -->
    <script>
      try {
        var t = localStorage.getItem('vk-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <style>
      /* Paint the right background before CSS loads */
      html { background: #0b0f17; }
      html[data-theme='light'] { background: #f7f6f2; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <!--NOSCRIPT_BODY-->
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
